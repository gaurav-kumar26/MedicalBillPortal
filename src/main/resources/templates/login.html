<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 col-md-4 mx-auto shadow">

        <h3 class="text-center mb-3">Medical Bill Portal Login</h3>

        <form th:action="@{/login}" method="post">

            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="text" name="username" class="form-control" placeholder="Enter Email" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
            </div>

            <div class="mb-3">
                <label>Login As</label>
                <select name="role" class="form-control">
                    <option value="EMPLOYEE">Employee</option>
                    <option value="RECEPTIONIST">Receptionist</option>
                    <option value="MEDICAL">Medical Officer</option>
                    <option value="FINANCE">Finance Officer</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>

            <div class="text-end mt-2">
                <a th:href="@{/forgot-password}">Forgot Password?</a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
