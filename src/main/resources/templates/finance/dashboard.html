<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Finance Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<div class="container mt-4">

    <h2 class="text-center mb-4">Finance Payment Dashboard</h2>

    <div class="card shadow p-3">

        <table class="table table-bordered table-hover text-center">

            <thead class="table-dark">
                <tr>
                    <th>Claim ID</th>
                    <th>Employee Name</th>
                    <th>Total Amount</th>
                    <th>Approved Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="c : ${claims}">

                    <!-- 🔥 Better ID -->
                    <td th:text="${c.claimId}"></td>

                    <!-- 🔥 FIXED -->
                    <td th:text="${c.employee != null ? c.employee.name : 'N/A'}"></td>

                    <!-- 🔥 FIXED -->
                    <td th:text="${c.totalAmount}"></td>

                    <td th:text="${c.approvedAmount}"></td>

                    <td th:text="${c.status}"></td>

                    <td>
                        <form th:action="@{'/finance/pay/' + ${c.id}}" method="post">

                            <button class="btn btn-success btn-sm"
                                    onclick="return confirm('Confirm Payment?')">
                                Pay
                            </button>

                        </form>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
