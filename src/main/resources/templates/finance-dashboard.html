<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Finance Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background: #f4f6fb; }
		.card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
	</style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="d-flex">
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<main class="flex-grow-1 p-4">
		<div class="container-fluid">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
				<h2 class="fw-bold mb-0">Finance Module</h2>
				<div class="text-muted">Approve payment and mark claims as paid</div>
			</div>

			<div class="card card-soft p-4">
				<h5 class="mb-3">Approved Claims (Medical Approved)</h5>

				<div class="table-responsive">
					<table class="table table-bordered align-middle table-hover mb-0">
						<thead class="table-light">
						<tr>
							<th>Claim ID</th>
							<th>Employee Name</th>
							<th>Bank Details</th>
							<th>Total Amount</th>
							<th>Approved Amount</th>
							<th>Status</th>
							<th>Actions</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="c : ${claims}">
							<td th:text="${c.claimId}">CLM-XXXX</td>
							<td th:text="${c.employee != null ? c.employee.name : 'N/A'}">N/A</td>
							<td>
								<div class="small">
									<div><strong>A/C:</strong> <span th:text="${c.employee != null ? c.employee.bankAccount : '-'}">-</span></div>
									<div><strong>IFSC:</strong> <span th:text="${c.employee != null ? c.employee.ifscCode : '-'}">-</span></div>
								</div>
							</td>
							<td th:text="${c.totalAmount}">0</td>
							<td th:text="${c.approvedAmount != null ? c.approvedAmount : 0}">0</td>
							<td th:text="${c.status}">MEDICAL_APPROVED</td>
							<td style="min-width: 260px;">
								<div class="d-grid gap-2">
									<form th:action="@{'/finance/pay/' + ${c.id}}" method="post">
										<button type="submit" class="btn btn-success btn-sm fw-semibold w-100"
												onclick="return confirm('Confirm payment for this claim?');">
											<i class="bi bi-cash-coin me-2"></i>Approve Payment
										</button>
									</form>

									<button class="btn btn-outline-secondary btn-sm fw-semibold w-100" type="button" disabled>
										Hold Payment (Backend not implemented)
									</button>
								</div>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(claims)}">
							<td colspan="7" class="text-center text-muted py-4">No approved claims found.</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
