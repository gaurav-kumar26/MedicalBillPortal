<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Finance Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background: #f4f6fb; }
		.card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
	</style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="d-flex">
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<main class="flex-grow-1 p-4">
		<div class="container-fluid">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
				<h2 class="fw-bold mb-0">Finance Module</h2>
				<div class="text-muted">Approve payment and mark claims as paid</div>
			</div>

			<!-- Stats Cards -->
			<div class="row g-3 mb-4">
				<div class="col-md-3">
					<div class="card border-0 shadow-sm text-white" style="border-radius: 18px; background:#0d6efd;">
						<div class="card-body p-3">
							<div class="fw-semibold">Total Claims</div>
							<div class="fs-3 fw-bold" th:text="${totalClaims}">0</div>
						</div>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card border-0 shadow-sm text-white" style="border-radius: 18px; background:#198754;">
						<div class="card-body p-3">
							<div class="fw-semibold">Approved</div>
							<div class="fs-3 fw-bold" th:text="${approvedClaims}">0</div>
						</div>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card border-0 shadow-sm text-dark" style="border-radius: 18px; background:#ffc107;">
						<div class="card-body p-3">
							<div class="fw-semibold">Pending</div>
							<div class="fs-3 fw-bold" th:text="${pendingClaims}">0</div>
						</div>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card border-0 shadow-sm text-white" style="border-radius: 18px; background:#dc3545;">
						<div class="card-body p-3">
							<div class="fw-semibold">Rejected</div>
							<div class="fs-3 fw-bold" th:text="${rejectedClaims}">0</div>
						</div>
					</div>
				</div>
			</div>

			<div class="card card-soft p-4">
				<h5 class="mb-3">Approved Claims (Medical Approved)</h5>

				<div th:if="${error}" class="alert alert-danger py-2 mb-3" th:text="${error}">Error</div>
				<div th:if="${success}" class="alert alert-success py-2 mb-3" th:text="${success}">Success</div>

				<div class="table-responsive">
					<table class="table table-bordered align-middle table-hover mb-0 table-sm">
						<thead class="table-light">
						<tr>
							<th>Claim ID</th>
							<th>Employee Name</th>
							<th>Bank Details</th>
							<th>Total Amount</th>
							<th>Approved Amount</th>
							<th>Status</th>
							<th>Actions</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="c : ${claims}">
							<td th:text="${c.claimId}">CLM-XXXX</td>
							<td th:text="${c.employee != null ? c.employee.name : 'N/A'}">N/A</td>
							<td>
								<div class="small">
									<div><strong>A/C:</strong> <span th:text="${c.employee != null ? c.employee.bankAccount : '-'}">-</span></div>
									<div><strong>IFSC:</strong> <span th:text="${c.employee != null ? c.employee.ifscCode : '-'}">-</span></div>
								</div>
							</td>
							<td class="fw-semibold" th:text="${c.totalAmount}">0</td>
							<td class="fw-bold text-success" th:text="${c.approvedAmount != null ? c.approvedAmount : 0}">0</td>
							<td>
								<span class="badge rounded-pill"
									  th:classappend="${c.status == 'FINANCE_PAID' ? 'bg-success' : ''}"
									  th:classappend="${c.status == 'FINANCE_REJECTED' ? 'bg-danger' : ''}"
									  th:classappend="${c.status == 'FINANCE_HOLD' ? 'bg-warning text-dark' : ''}"
									  th:classappend="${c.status == 'MEDICAL_APPROVED' ? 'bg-primary' : ''}"
									  th:text="${c.status}">STATUS</span>
							</td>
							<td style="min-width: 360px;">
								<div class="d-grid gap-2">
									<form th:action="@{'/finance/approve/' + ${c.id}}" method="post">
										<button type="submit" class="btn btn-success btn-sm fw-semibold w-100"
												onclick="return confirm('Approve and process payment?');">
											<i class="bi bi-cash-coin me-2"></i>Approve (Pay)
										</button>
									</form>

									<form th:action="@{'/finance/hold/' + ${c.id}}" method="post" class="d-grid gap-2">
										<input type="text" name="remarks" class="form-control form-control-sm"
											   placeholder="Hold remarks (required)" required>
										<button type="submit" class="btn btn-outline-warning btn-sm fw-semibold w-100">
											Hold
										</button>
									</form>

									<form th:action="@{'/finance/reject/' + ${c.id}}" method="post" class="d-grid gap-2">
										<input type="text" name="remarks" class="form-control form-control-sm"
											   placeholder="Rejection remarks (required)" required>
										<button type="submit" class="btn btn-outline-danger btn-sm fw-semibold w-100">
											Reject
										</button>
									</form>
								</div>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(claims)}">
							<td colspan="7" class="text-center text-muted py-4">No approved claims found.</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
