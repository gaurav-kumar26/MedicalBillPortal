<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Claim Status</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background: #f4f6fb; }
		.card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
		.status-pill { font-weight: 700; }
	</style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="d-flex">
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<main class="flex-grow-1 p-4">
		<div class="container-fluid">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
				<h2 class="fw-bold mb-0">Claim Status</h2>
				<a th:href="@{/employee/dashboard}" class="btn btn-secondary btn-sm fw-semibold">
					Back to Dashboard
				</a>
			</div>

			<div class="card card-soft p-4">
				<div class="table-responsive">
					<table class="table table-bordered align-middle table-hover mb-0">
						<thead class="table-light">
						<tr>
							<th>Claim ID</th>
							<th>Status</th>
							<th>Remarks</th>
							<th>Approved Amount</th>
							<th>Rejection Reason</th>
							<th>Bill</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="c : ${claims}">
							<td th:text="${c.claimId}">CLM-XXXX</td>
							<td>
								<span class="badge rounded-pill status-pill"
									  th:classappend="${c.status == 'FINANCE_PAID' ? 'bg-success' : ''}"
									  th:classappend="${c.status != 'FINANCE_PAID' and c.status == 'MEDICAL_APPROVED' ? 'bg-primary' : ''}"
									  th:classappend="${c.status == 'MEDICAL_REJECTED' ? 'bg-danger' : ''}"
									  th:classappend="${c.status == 'RECEPTION_VERIFIED' ? 'bg-info' : ''}"
									  th:classappend="${c.status == 'ON_HOLD' or c.status == 'PENDING' ? 'bg-warning text-dark' : ''}"
									  th:text="${c.status}">
									STATUS
								</span>
							</td>
							<td th:text="${c.remarks}">-</td>
							<td th:text="${c.approvedAmount != null ? c.approvedAmount : 0}">0</td>
							<td th:text="${c.status == 'MEDICAL_REJECTED' ? c.remarks : '-'}">-</td>
							<td>
								<a th:if="${c.billPath != null}" th:href="@{'/uploads/bills/' + ${c.billPath}}" target="_blank" class="btn btn-sm btn-outline-secondary">
									View
								</a>
								<span th:if="${c.billPath == null}" class="text-muted small">-</span>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(claims)}">
							<td colspan="6" class="text-center text-muted py-4">No claims found.</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
