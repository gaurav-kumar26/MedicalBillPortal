<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claim Status</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background: #f4f6fb; }
        .card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
        .status-pill { font-weight: 700; }
    </style>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="d-flex">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="flex-grow-1 p-4">
        <div class="container-fluid">

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <h2 class="fw-bold mb-0">Claim Status</h2>

                <a th:href="@{/employee/dashboard}" class="btn btn-secondary btn-sm fw-semibold">
                    Back to Dashboard
                </a>
            </div>

            <div class="card card-soft p-4">

                <!-- Alerts -->
                <div th:if="${error}" class="alert alert-danger py-2 mb-3" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success py-2 mb-3" th:text="${success}"></div>

                <!-- Table -->
                <div class="table-responsive">
                    <table class="table table-bordered align-middle table-hover mb-0">

                        <thead class="table-light">
                        <tr>
                            <th>Claim ID</th>
                            <th>Status</th>
                            <th>Approved Amount</th>
                            <th>Remarks History</th>
                            <th>Timeline</th>
                            <th>Bill</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="c : ${claims}">

                            <!-- Claim ID -->
                            <td th:text="${c.claimId}">CLM-XXXX</td>

                            <!-- Status -->
                            <td>
                                <span class="badge rounded-pill status-pill"
                                      th:classappend="${
                                        c.status == 'FINANCE_PAID' ? 'bg-success' :
                                        c.status == 'FINANCE_REJECTED' ? 'bg-danger' :
                                        c.status == 'FINANCE_HOLD' ? 'bg-warning text-dark' :
                                        c.status == 'MEDICAL_APPROVED' ? 'bg-primary' :
                                        c.status == 'MEDICAL_REJECTED' ? 'bg-danger' :
                                        c.status == 'RECEPTION_VERIFIED' ? 'bg-info' :
                                        (c.status == 'ON_HOLD' or c.status == 'PENDING') ? 'bg-warning text-dark' :
                                        'bg-secondary'
                                      }"
                                      th:text="${c.status}">
                                </span>
                            </td>

                            <!-- Approved Amount -->
                            <td th:text="${c.approvedAmount != null ? c.approvedAmount : 0}">0</td>

                            <!-- Remarks -->
                            <td>
                                <div th:if="${c.remarks != null and !#strings.isEmpty(c.remarks)}">
                                    <ul class="mb-0 small">
                                        <li th:each="line : ${#strings.arraySplit(c.remarks, '\n')}"
                                            th:if="${!#strings.isEmpty(line)}"
                                            th:text="${line}">
                                        </li>
                                    </ul>
                                </div>
                                <span th:if="${c.remarks == null or #strings.isEmpty(c.remarks)}"
                                      class="text-muted small">-</span>
                            </td>

                            <!-- Timeline -->
                            <td style="min-width: 260px;">
                                <div class="small">

                                    <div class="d-flex align-items-center gap-2 mb-1">
                                        <span class="badge bg-secondary">Submitted</span>
                                        <span class="text-muted">→</span>

                                        <span class="badge"
                                              th:classappend="${
                                                c.status == 'RECEPTION_VERIFIED' or
                                                c.status == 'MEDICAL_APPROVED' or
                                                c.status == 'MEDICAL_REJECTED' or
                                                c.status == 'FINANCE_PAID' or
                                                c.status == 'FINANCE_HOLD' or
                                                c.status == 'FINANCE_REJECTED'
                                                ? 'bg-info'
                                                : 'bg-light text-dark border'
                                              }">
                                            Reception
                                        </span>
                                    </div>

                                    <div class="d-flex align-items-center gap-2 mb-1">

                                        <span class="badge"
                                              th:classappend="${
                                                c.status == 'MEDICAL_APPROVED' or
                                                c.status == 'FINANCE_PAID' or
                                                c.status == 'FINANCE_HOLD' or
                                                c.status == 'FINANCE_REJECTED'
                                                ? 'bg-primary'
                                                : (c.status == 'MEDICAL_REJECTED'
                                                    ? 'bg-danger'
                                                    : 'bg-light text-dark border')
                                              }">
                                            Medical
                                        </span>

                                        <span class="text-muted">→</span>

                                        <span class="badge"
                                              th:classappend="${
                                                c.status == 'FINANCE_PAID' ? 'bg-success' :
                                                c.status == 'FINANCE_HOLD' ? 'bg-warning text-dark' :
                                                c.status == 'FINANCE_REJECTED' ? 'bg-danger' :
                                                'bg-light text-dark border'
                                              }">
                                            Finance
                                        </span>

                                        <span class="text-muted">→</span>

                                        <span class="badge"
                                              th:classappend="${
                                                c.status == 'FINANCE_PAID'
                                                ? 'bg-success'
                                                : 'bg-light text-dark border'
                                              }">
                                            Paid
                                        </span>
                                    </div>

                                </div>
                            </td>

                            <!-- Bill -->
                            <td>
                                <a th:if="${c.billPath != null}"
                                   th:href="@{'/uploads/bills/' + ${c.billPath}}"
                                   target="_blank"
                                   class="btn btn-sm btn-outline-secondary">
                                    View
                                </a>

                                <span th:if="${c.billPath == null}" class="text-muted small">-</span>
                            </td>

                        </tr>

                        <!-- Empty -->
                        <tr th:if="${#lists.isEmpty(claims)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                No claims found.
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>
</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
