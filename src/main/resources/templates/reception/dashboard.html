<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Reception Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<div class="container mt-4">

    <h2 class="text-center mb-4">Reception Dashboard</h2>

    <div class="card shadow p-3">

        <table class="table table-bordered table-hover text-center">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Employee Name</th>
                    <th>GST Number</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="c : ${claims}">

                    <td th:text="${c.id}"></td>
                    <td th:text="${c.employee.name}"></td>
                    <td th:text="${c.gstNumber}"></td>
                    <td th:text="${c.totalAmount}"></td>
                    <td th:text="${c.status}"></td>

                    <td>

                        <!-- VERIFY BUTTON -->
                        <form th:action="@{'/reception/verify/' + ${c.id}}"
                              method="post"
                              style="display:inline;">

                            <button type="submit"
                                    class="btn btn-success btn-sm"
                                    onclick="return confirm('Verify this claim?')">
                                Verify
                            </button>

                        </form>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
