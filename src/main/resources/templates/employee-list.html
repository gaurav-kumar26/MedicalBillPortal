<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Employee List</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background: #f4f6fb; }
		.card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
	</style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="d-flex">
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<main class="flex-grow-1 p-4">
		<div class="container-fluid">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
				<h2 class="fw-bold mb-0">All Employees</h2>
				<a th:href="@{/employee/form}" class="btn btn-outline-primary btn-sm fw-semibold">
					<i class="bi bi-plus-circle me-2"></i>Add Employee
				</a>
			</div>

			<div class="card card-soft p-4">
				<div class="table-responsive">
					<table class="table table-bordered align-middle table-hover mb-0">
						<thead class="table-light">
						<tr>
							<th>Employee Code</th>
							<th>Name</th>
							<th>Department</th>
							<th>Designation</th>
							<th>Bank Account</th>
							<th>Yearly Limit</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="e : ${employees}">
							<td th:text="${e.employeeCode}">EMP001</td>
							<td th:text="${e.name}">Name</td>
							<td th:text="${e.department}">Dept</td>
							<td th:text="${e.designation}">Role</td>
							<td th:text="${e.bankAccount}">ACC</td>
							<td th:text="${e.yearlyLimit != null ? e.yearlyLimit : 0}">0</td>
						</tr>
						<tr th:if="${#lists.isEmpty(employees)}">
							<td colspan="6" class="text-center text-muted py-4">No employees found.</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
