<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Claim Form</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background: #f4f6fb; }
		.card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
		.form-section-title { font-weight: 800; letter-spacing: .2px; }
	</style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="d-flex">
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<main class="flex-grow-1 p-4">
		<div class="container-fluid">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
				<h2 class="fw-bold mb-0">Employee Claim Submission</h2>
				<div class="text-muted small">Upload and submit for verification</div>
			</div>

			<div class="card card-soft p-4">
				<form th:action="@{/claims/submit}" th:object="${claim}" method="post" enctype="multipart/form-data">

					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label fw-semibold">Employee Name</label>
							<input type="text" class="form-control" th:value="${employeeName}" disabled>
						</div>
						<div class="col-md-6">
							<label class="form-label fw-semibold">Employee ID</label>
							<input type="text" class="form-control" th:value="${employeeCode}" disabled>
						</div>
					</div>

					<hr class="my-4" />

					<div class="row g-3">
						<div class="col-md-4">
							<label class="form-label fw-semibold">Claim Type</label>
							<select id="claimType" name="claimType" class="form-control">
                                <option value="">Choose...</option>
                                <option value="Medicine">Medicine</option>
                                <option value="Surgery">Surgery</option>
                            </select>
						</div>
						<div class="col-md-4">
							<label class="form-label fw-semibold">Bill Date</label>
							<input type="date" id="billDate" class="form-control" disabled>
						</div>
						<div class="col-md-4">
							<label class="form-label fw-semibold">GST Number</label>
							<input type="text" th:field="*{gstNumber}" class="form-control" required>
						</div>
					</div>

					<div class="row g-3 mt-1">
						<div class="col-md-6">
							<label class="form-label fw-semibold">Hospital Name</label>
							<input type="text" class="form-control" name="hospitalName" placeholder="Hospital / Clinic name">
						</div>
						<div class="col-md-6">
							<label class="form-label fw-semibold">Doctor Name (Optional)</label>
							<input type="text" class="form-control" name="doctorName" placeholder="Doctor name">
						</div>
					</div>

					<div class="mb-3 mt-2">
						<label class="form-label fw-semibold">Bill Description / Remarks</label>
						<textarea th:field="*{remarks}" class="form-control" rows="3" placeholder="Add bill details, treatment notes, etc."></textarea>
					</div>

					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label fw-semibold">Upload Bill (PDF)</label>
							<input type="file" name="file" class="form-control" accept="application/pdf" required>
						</div>
						<div class="col-md-6">
							<label class="form-label fw-semibold">Upload Medical Reports (Optional)</label>
							<input type="file" name="reports" class="form-control" accept="application/pdf,image/*" multiple>
							<div class="text-muted small mt-2">Reports are accepted by UI (current backend uses the main bill file).</div>
						</div>
					</div>

					<hr class="my-4" />

					<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
						<div>
							<div class="form-section-title mb-1">Medicine / Operation Details</div>
							<div class="text-muted small"> Total amount is calculated automatically.</div>
						</div>
						<div class="text-end">
							<label class="form-label fw-semibold mb-1">Total Amount</label>
							<div class="d-flex align-items-center justify-content-end gap-2">
								<input type="number" th:field="*{totalAmount}" id="totalAmountField" step="0.01" class="form-control form-control-sm" style="width: 160px;" readonly required>
								<span class="badge bg-light text-dark border" id="computedTotalLabel">0.00</span>
							</div>
						</div>
					</div>

					<div class="table-responsive">
						<table class="table table-bordered align-middle">
							<thead class="table-light">
							<tr>
								<th style="width: 45%;">Medicine / Operation</th>
								<th style="width: 15%;">Qty</th>
								<th style="width: 20%;">Price</th>
								<th style="width: 20%;">Line Total</th>
							</tr>
							</thead>
							<tbody id="medicineItems">
							<!-- Rows injected by JS -->
							</tbody>
						</table>
					</div>

					<div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
						<button type="button" id="addMedicineBtn" class="btn btn-outline-primary fw-semibold">
							<i class="bi bi-plus-circle me-2"></i>Add Medicine / Operation
						</button>
					
					</div>

					<div class="alert alert-warning mt-3 mb-3" th:if="${error}">
						<span th:text="${error}"></span>
					</div>

					<div class="d-flex flex-wrap gap-2 mt-3">
						<button type="submit" class="btn btn-primary fw-semibold">
							<i class="bi bi-send-check me-2"></i>Submit Claim
						</button>
						<a th:href="@{/employee/dashboard}" class="btn btn-secondary fw-semibold">
							Back
						</a>
					</div>
				</form>
			</div>
		</div>
	</main>
</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
	(function () {
		const tbody = document.getElementById('medicineItems');
		const addBtn = document.getElementById('addMedicineBtn');
		const totalField = document.getElementById('totalAmountField');
		const computedLabel = document.getElementById('computedTotalLabel');

		const MAX_ROWS = 10;
		const MIN_ROWS = 1;
		let rowCount = 0;

		function formatMoney(n) {
			const num = Number(n);
			if (Number.isNaN(num)) return '0.00';
			return num.toFixed(2);
		}

		function recalcTotals() {
			let total = 0;
			const rows = tbody.querySelectorAll('tr[data-row]');
			rows.forEach(row => {
				const qty = parseFloat(row.querySelector('.med-qty').value || '0');
				const price = parseFloat(row.querySelector('.med-price').value || '0');
				const line = (Number.isFinite(qty) ? qty : 0) * (Number.isFinite(price) ? price : 0);
				total += line;
				row.querySelector('.line-total').textContent = formatMoney(line);
			});

			totalField.value = total.toFixed(2);
			computedLabel.textContent = formatMoney(total);
		}

		function createRow() {
			const tr = document.createElement('tr');
			tr.setAttribute('data-row', String(rowCount));
			tr.innerHTML = `
				<td>
					<input type="text" class="form-control form-control-sm med-name" placeholder="e.g., Tablet / Procedure" required />
				</td>
				<td>
					<input type="number" class="form-control form-control-sm med-qty" min="1" step="1" value="1" required oninput="void(0)" />
				</td>
				
				
				<td>
					<input type="number" class="form-control form-control-sm med-price" min="0" step="0.01" value="0" required />
				</td>
				<td class="text-end">
					<span class="line-total">0.00</span>
				</td>
			`;

			const inputs = tr.querySelectorAll('input');
			inputs.forEach(i => {
				i.addEventListener('input', recalcTotals);
			});

			tbody.appendChild(tr);
			rowCount++;
		}

		function ensureMinRows() {
			while (rowCount < MIN_ROWS) createRow();
		}

		addBtn.addEventListener('click', function () {
			if (rowCount >= MAX_ROWS) return;
			createRow();
			recalcTotals();
		});

		// Initialize
		ensureMinRows();
		recalcTotals();

		// Set today's date for Bill Date
		const billDate = document.getElementById('billDate');
		if (billDate) {
			const now = new Date();
			const iso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
			billDate.value = iso;
		}
	})();
	
	const claimTypeSelect = document.getElementById("claimType");

	claimTypeSelect.addEventListener("change", function () {
	    const isSurgery = this.value === "Surgery";

	    document.querySelectorAll(".med-qty").forEach(input => {
	        if (isSurgery) {
	            input.value = 1;
	            input.disabled = true;
	        } else {
	            input.disabled = false;
	        }
	    });
	});

	// run on page load
	window.addEventListener("load", () => {
	    claimTypeSelect.dispatchEvent(new Event("change"));
	});
</script>
</body>
</html>
