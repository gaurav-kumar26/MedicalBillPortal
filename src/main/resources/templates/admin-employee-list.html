<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Employee Management</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
	rel="stylesheet">
<style>
body {
	background: #f4f6fb;
}

.card-soft {
	border: 0;
	border-radius: 18px;
	box-shadow: 0 12px 35px rgba(0, 0, 0, .06);
}
</style>
</head>
<body>
	<div th:replace="fragments/header :: header"></div>
	<div class="d-flex">
		<div th:replace="fragments/sidebar :: sidebar"></div>
		<main class="flex-grow-1 p-4">
			<div class="container-fluid">

				<div class="d-flex justify-content-between align-items-center mb-3">
					<h2 class="fw-bold mb-0">👥 Employee Management</h2>
					<a href="/admin/employees/add" class="btn btn-primary fw-semibold">
						<i class="bi bi-plus-circle me-1"></i>Add Employee
					</a>
				</div>

				<div th:if="${success}" class="alert alert-success"
					th:text="${success}"></div>
				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

				<div class="card card-soft p-3">
					<div class="table-responsive">
						<table class="table table-bordered table-hover align-middle mb-0">
							<thead class="table-light">
								<tr>
									<th>ID</th>
									<th>Emp Code</th>
									<th>Name</th>
									<th>Role</th>
									<th>Department</th>
									<th>Designation</th>
									<th>Status</th>
									<th>Yearly Limit</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="e : ${employees}"
									th:classappend="${e.enabled == false} ? 'table-warning'">
									<td th:text="${e.id}"></td>
									<td th:text="${e.employeeCode}"></td>
									<td th:text="${e.name}"></td>
									<td><span class="badge bg-secondary" th:text="${e.role}"></span></td>
									<td th:text="${e.department}"></td>
									<td th:text="${e.designation}"></td>
									<td><span th:if="${e.enabled == true}"
										class="badge bg-success">Active</span> <span
										th:if="${e.enabled == false}" class="badge bg-danger">Suspended</span>
									</td>
									<td
										th:text="${e.yearlyLimit != null ? '₹' + e.yearlyLimit : '—'}"></td>
									<td>
										<div class="d-flex flex-wrap gap-1">
											<a th:href="@{'/admin/employees/edit/' + ${e.id}}"
												class="btn btn-sm btn-outline-primary">Edit</a>

											<form th:if="${e.enabled == true}"
												th:action="@{'/admin/employees/suspend/' + ${e.id}}"
												method="post" style="display: inline">
												<button class="btn btn-sm btn-warning"
													onclick="return confirm('Suspend this employee?')">Suspend</button>
											</form>

											<form th:if="${e.enabled == false}"
												th:action="@{'/admin/employees/activate/' + ${e.id}}"
												method="post" style="display: inline">
												<button class="btn btn-sm btn-success">Activate</button>
											</form>

											<form th:action="@{'/admin/employees/delete/' + ${e.id}}"
												method="post" style="display: inline">
												<button class="btn btn-sm btn-danger"
													onclick="return confirm('Delete permanently?')">Delete</button>
											</form>
										</div>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(employees)}">
									<td colspan="9" class="text-center text-muted py-4">No
										employees found.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
	<div th:replace="fragments/footer :: footer"></div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
