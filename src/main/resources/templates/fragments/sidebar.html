<div xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:fragment="sidebar">

	<button id="sidebarToggle"
		class="btn btn-sm btn-outline-secondary position-fixed"
		style="top: 70px; left: 10px; z-index: 999; display: none;"
		onclick="toggleSidebar()">☰</button>

	<div id="sidebarPanel" class="bg-white border-end p-3"
		style="width: 240px; min-height: 100vh; height: 100%; flex-shrink: 0; transition: all 0.3s ease;">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h6 class="text-muted mb-0 fw-bold">Modules</h6>
			<button class="btn btn-sm btn-outline-secondary"
				onclick="toggleSidebar()">✕</button>
		</div>

		<ul class="nav flex-column gap-1">

			<!-- EMPLOYEE -->
			<li class="nav-item" sec:authorize="hasRole('EMPLOYEE')"><a
				class="nav-link py-2 px-2 rounded" href="/employee/dashboard">🏠
					Dashboard</a></li>
			<li class="nav-item" sec:authorize="hasRole('EMPLOYEE')"><a
				class="nav-link py-2 px-2 rounded" href="/claims/form">📋 Submit
					Claim</a></li>
			<li class="nav-item" sec:authorize="hasRole('EMPLOYEE')"><a
				class="nav-link py-2 px-2 rounded" href="/claims/status">📊
					Claim Status</a></li>
			<li class="nav-item" sec:authorize="hasRole('EMPLOYEE')"><a
				class="nav-link py-2 px-2 rounded" href="/employee/claim-history">📜
					Claim History</a></li>

			<!-- ADMIN -->
			
			

			<!-- ADMIN section — add after existing Admin Control link -->
			<li class="nav-item" sec:authorize="hasRole('ADMIN')"><a
				class="nav-link py-2 px-2 rounded" href="/admin/dashboard">🛡️
					Admin Control</a></li>
			<li class="nav-item" sec:authorize="hasRole('ADMIN')"><a
				class="nav-link py-2 px-2 rounded" href="/admin/employees">👥
					Employee CRUD</a></li>
			<li class="nav-item" sec:authorize="hasRole('ADMIN')"><a
				class="nav-link py-2 px-2 rounded" href="/admin/workflow">📊
					Workflow History</a></li>

			<!-- RECEPTION -->
			<li class="nav-item" sec:authorize="hasRole('RECEPTION')"><a
				class="nav-link py-2 px-2 rounded" href="/reception/dashboard">🧾
					Reception</a></li>

			<!-- MEDICAL -->
			<li class="nav-item" sec:authorize="hasRole('MEDICAL_OFFICER')">
				<a class="nav-link py-2 px-2 rounded" href="/medical/dashboard">🏥
					Medical Officer</a>
			</li>

			<!-- FINANCE -->
			<li class="nav-item" sec:authorize="hasRole('FINANCE_OFFICER')">
				<a class="nav-link py-2 px-2 rounded" href="/finance/dashboard">💰
					Finance</a>
			</li>

		</ul>
	</div>

	<script>
		function toggleSidebar() {
			const panel = document.getElementById('sidebarPanel');
			const toggle = document.getElementById('sidebarToggle');
			const isOpen = panel.style.display !== 'none';
			panel.style.display = isOpen ? 'none' : 'block';
			toggle.style.display = isOpen ? 'block' : 'none';
		}
	</script>
</div>
