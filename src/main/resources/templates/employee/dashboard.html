<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 🔥 Custom Styling -->
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            color: white;
        }

        .card {
            border: none;
            border-radius: 20px;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.85);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
        }

        .card i {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .dashboard-title {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- 🔥 Header -->
    <div th:replace="fragments/header :: header"></div>

    <div class="container mt-5 text-center">
        <h2 class="dashboard-title mb-5">
            Welcome, <span th:text="${username}">User</span>
        </h2>

        <div class="row justify-content-center g-4">

            <!-- Submit Claim -->
            <div class="col-md-3">
                <div class="card p-4 shadow text-dark">
                    <i class="bi bi-upload text-primary"></i>
                    <h5>Submit Claim</h5>
                    <p>Upload your medical bills</p>
                    <a th:href="@{/employee/submit}" class="btn btn-primary w-100">Go</a>
                </div>
            </div>

            <!-- View Status -->
            <div class="col-md-3">
                <div class="card p-4 shadow text-dark">
                    <i class="bi bi-search text-success"></i>
                    <h5>View Status</h5>
                    <p>Track your claims</p>
                    <a th:href="@{/employee/status}" class="btn btn-success w-100">Go</a>
                </div>
            </div>

            <!-- Logout -->
            <div class="col-md-3">
                <div class="card p-4 shadow text-dark">
                    <i class="bi bi-box-arrow-right text-danger"></i>
                    <h5>Logout</h5>
                    <p>Exit from system</p>

                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-danger w-100">
                            Logout
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <!-- 🔥 Footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
