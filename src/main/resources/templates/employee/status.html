<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Claim Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Claim Status</h2>

    <table class="table table-bordered mt-4">
        <thead>
            <tr>
                <th>Claim ID</th>
                <th>Patient</th>
                <th>Amount</th>
                <th>GST</th>
                <th>Status</th>
                <th>Bill</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="c : ${claims}">
    <td th:text="${c.claimId}"></td>

    <!-- 🔥 FIXED -->
    <td th:text="${c.employee != null ? c.employee.name : 'N/A'}"></td>

    <td th:text="${c.totalAmount}"></td>
    <td th:text="${c.gstNumber}"></td>
    <td th:text="${c.status}"></td>

    <td>
        <a th:href="@{'/uploads/bills/' + ${c.billPath}}" target="_blank">
            View
        </a>
    </td>
</tr>
        </tbody>
    </table>

    <a href="/employee/dashboard" class="btn btn-secondary">Back</a>
</div>

</body>
</html>
