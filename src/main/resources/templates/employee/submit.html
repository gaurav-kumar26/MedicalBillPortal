<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Submit Claim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Submit Medical Claim</h2>

    <form th:action="@{/employee/submit}" 
          th:object="${claim}" 
          method="post" 
          enctype="multipart/form-data">

        <div class="mb-3">
            <label>Patient Name</label>
            <input type="text" th:field="*{patientName}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Hospital Name</label>
            <input type="text" th:field="*{hospitalName}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Total Amount</label>
            <input type="number" th:field="*{totalAmount}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>GST Number</label>
            <input type="text" th:field="*{gstNumber}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Upload Bill</label>
            <input type="file" name="file" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Submit Claim</button>
    </form>

    <p class="text-danger mt-3" th:text="${error}"></p>

</div>

</body>
</html>
