<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Employee Login - CCL Medical Claim Portal</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body{
			min-height:100vh;
			background: linear-gradient(135deg, #0d6efd, #764ba2);
		}
		.login-card{
			border:0;
			border-radius:18px;
			box-shadow: 0 15px 40px rgba(0,0,0,0.18);
		}
	</style>
</head>
<body>
<main class="container py-5">
	<div class="row justify-content-center">
		<div class="col-md-6 col-lg-4">
			<div class="login-card bg-white p-4 p-md-5">
				<div class="text-center mb-4">
					<div class="d-flex align-items-center justify-content-center gap-2">
						<i class="bi bi-clipboard2-pulse fs-3 text-primary"></i>
						<h2 class="h4 mb-0">Employee Login</h2>
					</div>
					<p class="text-muted mb-0">Use your Employee ID to sign in.</p>
				</div>

				<div th:if="${param.error}" class="alert alert-danger py-2">
					Invalid username or password.
				</div>

				<form th:action="@{/login}" method="post">
					<div class="mb-3">
						<label class="form-label fw-semibold">Employee ID</label>
						<input type="text" name="username" class="form-control" placeholder="e.g., EMP001" required>
					</div>

					<div class="mb-2">
						<label class="form-label fw-semibold">Password</label>
						<input type="password"
							   name="password"
							   class="form-control"
							   placeholder="Enter password"
							   required
							   pattern="^(?=.*[A-Z])(?=.*\\d).{8,}$"
							   title="Password must be at least 8 characters, include 1 uppercase letter and 1 number.">
						<div class="form-text">Min 8 chars, 1 uppercase, 1 number.</div>
					</div>

					<button type="submit" class="btn btn-primary w-100 mt-3 fw-semibold">
						<i class="bi bi-box-arrow-in-right me-2"></i>Login
					</button>

					<div class="text-center mt-3">
						<a th:href="@{/staff/login}" class="text-decoration-none">Staff Login</a>
					</div>
				</form>
			</div>
		</div>
	</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
