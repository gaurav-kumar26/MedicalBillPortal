<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #764ba2);
        }
        .login-card {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
        }
    </style>
</head>

<body>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <div class="login-card bg-white p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="d-flex justify-content-center align-items-center gap-2">
                        <i class="bi bi-person-circle fs-3 text-primary"></i>
                        <h3 class="mb-0">Employee Login</h3>
                    </div>
                    <p class="text-muted">Use your Employee ID</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger">
                    Invalid username or password
                </div>

                <form th:action="@{/auth/process-login}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Employee ID</label>
                        <input type="text"
                               name="employeeId"
                               class="form-control"
                               placeholder="EMP001"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter password"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>

                    <div class="text-center mt-3">
                        <a th:href="@{/staff/login}">Go to Staff Login</a>
                    </div>

                </form>

            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
