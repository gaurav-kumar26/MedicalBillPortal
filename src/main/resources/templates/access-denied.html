<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Access Denied</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="fragments/header :: header"></div>

<div class="container py-5">
	<div class="card shadow-sm border-0">
		<div class="card-body p-4">
			<h3 class="fw-bold mb-2">Access Denied</h3>
			<p class="text-muted mb-4">
				You don’t have permission to view this page. Please use the correct role dashboard.
			</p>
			<a th:href="@{/dashboard}" class="btn btn-primary fw-semibold">Go to Dashboard</a>
			<a th:href="@{/home}" class="btn btn-outline-secondary fw-semibold ms-2">Home</a>
		</div>
	</div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
