<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Reception Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background: #f4f6fb; }
		.card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
	</style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="d-flex">
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<main class="flex-grow-1 p-4">
		<div class="container-fluid">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
				<h2 class="fw-bold mb-0">Reception Module</h2>
				<div class="text-muted">Hard-copy handling and reception verification</div>
			</div>

			<div class="card card-soft p-4">
				<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
					<h5 class="mb-0">Claims to Verify</h5>
					<div class="text-muted small">Action below updates the claim’s reception status.</div>
				</div>

				<div class="table-responsive">
					<table class="table table-bordered align-middle table-hover mb-0">
						<thead class="table-light">
						<tr>
							<th>Claim ID</th>
							<th>Employee Name</th>
							<th>GST</th>
							<th>Total Amount</th>
							<th>Status</th>
							<th>Bill</th>
							<th>Hard Copy</th>
							<th>Message</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="c : ${claims}">
							<td th:text="${c.claimId}">CLM-XXXX</td>
							<td th:text="${c.employee != null ? c.employee.name : 'N/A'}">N/A</td>
							<td th:text="${c.gstNumber}">-</td>
							<td th:text="${c.totalAmount}">0</td>
							<td th:text="${c.status}">PENDING</td>
							<td>
								<a th:if="${c.billPath != null}" th:href="@{'/uploads/bills/' + ${c.billPath}}" target="_blank" class="btn btn-sm btn-outline-secondary">
									PDF
								</a>
								<span th:if="${c.billPath == null}" class="text-muted small">-</span>
							</td>
							<td>
								<form th:action="@{'/reception/verify/' + ${c.id}}" method="post" class="d-flex flex-column gap-2">
									<select name="received" class="form-select form-select-sm">
										<option value="true">YES (Received)</option>
										<option value="false">NO (Not Received)</option>
									</select>
									<button type="submit" class="btn btn-primary btn-sm fw-semibold">
										Submit
									</button>
								</form>
							</td>
							<td th:text="${c.remarks}">-</td>
						</tr>

						<tr th:if="${#lists.isEmpty(claims)}">
							<td colspan="8" class="text-center text-muted py-4">No claims found.</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
