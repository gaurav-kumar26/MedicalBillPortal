<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Medical Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">

    <h2>Medical Officer Dashboard</h2>

    <!-- 🔍 Search -->
    <form th:action="@{/medical/search}" method="get" class="mb-3">
        <input type="text" name="claimId" placeholder="Enter Claim ID" class="form-control">
        <button class="btn btn-primary mt-2">Search</button>
    </form>

    <table class="table table-bordered">
        <tr>
            <th>Claim ID</th>
            <th>Patient</th>
            <th>Amount</th>
            <th>GST</th>
            <th>Remarks</th>
            <th>Action</th>
        </tr>

        <tr th:each="c : ${claims}">
            <td th:text="${c.claimId}"></td>
            <td th:text="${c.patientName}"></td>
            <td th:text="${c.totalAmount}"></td>
            <td th:text="${c.gstNumber}"></td>
            <td th:text="${c.remarks}"></td>

            <td>
                <!-- Approve -->
                <form th:action="@{'/medical/approve/' + ${c.id}}" method="post">
                    <input type="number" name="approvedAmount" placeholder="Approved Amount" required>
                    <input type="text" name="remarks" placeholder="Remarks" required>
                    <button class="btn btn-success btn-sm">Approve</button>
                </form>

                <!-- Reject -->
                <form th:action="@{'/medical/reject/' + ${c.id}}" method="post">
                    <input type="text" name="remarks" placeholder="Reason" required>
                    <button class="btn btn-danger btn-sm mt-1">Reject</button>
                </form>
            </td>
        </tr>
    </table>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
