<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Medical Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">

    <h2 class="text-center mb-4">Medical Officer Dashboard</h2>

    <!-- Search -->
    <form th:action="@{/medical/search}" method="get" class="mb-4 text-center">
        <input type="text" name="claimId" placeholder="Enter Claim ID" class="form-control w-50 d-inline">
        <button class="btn btn-primary mt-2">Search</button>
    </form>

    <div class="card shadow p-3">

        <table class="table table-bordered table-hover text-center">

            <thead class="table-dark">
                <tr>
                    <th>Claim ID</th>
                    <th>Employee</th>
                    <th>Total Amount</th>
                    <th>GST</th>
                    <th>Remarks</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="c : ${claims}">

                    <td th:text="${c.claimId}"></td>

                    <td th:text="${c.employee != null ? c.employee.name : 'N/A'}"></td>

                    <td th:text="${c.totalAmount}"></td>
                    <td th:text="${c.gstNumber}"></td>

                    <td th:text="${c.remarks != null ? c.remarks : '-'}"></td>

                    <td>

                      <form th:action="@{'/medical/approve/' + ${c.id}}"
      method="post"
      class="mb-2">

    <input type="number"
           name="approvedAmount"
           placeholder="Approved Amount"
           class="form-control mb-1"
           required>

    <input type="text"
           name="remarks"
           placeholder="Remarks"
           class="form-control mb-1"
           required>

    <button class="btn btn-success btn-sm w-100">
        Approve
    </button>
</form>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>
    
    

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
