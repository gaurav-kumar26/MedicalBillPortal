<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<div class="container mt-4">

    <h2 class="text-center mb-4">Admin Dashboard</h2>

    <!-- Stats Cards -->
    <div class="row text-center">

        <div class="col-md-3">
            <div class="card bg-primary text-white shadow p-3">
                <h5>Total Claims</h5>
                <h3 th:text="${total}"></h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-success text-white shadow p-3">
                <h5>Paid Claims</h5>
                <h3 th:text="${paid}"></h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning text-dark shadow p-3">
                <h5>Pending Claims</h5>
                <h3 th:text="${pending}"></h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-danger text-white shadow p-3">
                <h5>Rejected Claims</h5>
                <h3 th:text="${rejected}"></h3>
            </div>
        </div>

    </div>

    <!-- Table -->
    <div class="card mt-4 shadow p-3">

        <h5 class="mb-3">All Claims</h5>

        <table class="table table-bordered text-center">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Amount</th>
                    <th>Approved</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="c : ${claims}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.patientName}"></td>
                    <td th:text="${c.amount}"></td>
                    <td th:text="${c.approvedAmount}"></td>
                    <td th:text="${c.status}"></td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
