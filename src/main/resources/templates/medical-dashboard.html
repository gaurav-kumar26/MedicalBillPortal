<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Medical Officer Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background: #f4f6fb; }
		.card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
	</style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="d-flex">
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<main class="flex-grow-1 p-4">
		<div class="container-fluid">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
				<h2 class="fw-bold mb-0">Medical Officer Module</h2>
				<div class="text-muted">Approve / Reject and validate claim outcomes</div>
			</div>

			<div class="card card-soft p-4">
				<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
					<h5 class="mb-0">Verified Claims (Reception)</h5>
					<form th:action="@{/medical/search}" method="get" class="d-flex gap-2">
						<input type="text" name="claimId" class="form-control" placeholder="Search by Claim ID">
						<button class="btn btn-primary fw-semibold" type="submit">Search</button>
					</form>
				</div>

				<div class="table-responsive">
					<table class="table table-bordered align-middle table-hover mb-0">
						<thead class="table-light">
						<tr>
							<th>Claim ID</th>
							<th>Employee</th>
							<th>Total Amount</th>
							<th>GST</th>
							<th>Bill</th>
							<th>Actions</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="c : ${claims}">
							<td th:text="${c.claimId}">CLM-XXXX</td>
							<td th:text="${c.employee != null ? c.employee.name : 'N/A'}">N/A</td>
							<td th:text="${c.totalAmount}">0</td>
							<td th:text="${c.gstNumber}">-</td>
							<td>
								<a th:if="${c.billPath != null}" th:href="@{'/uploads/bills/' + ${c.billPath}}" target="_blank" class="btn btn-sm btn-outline-secondary">
									View Bill
								</a>
								<span th:if="${c.billPath == null}" class="text-muted small">-</span>
							</td>
							<td style="min-width: 420px;">
								<div class="d-grid gap-2">
									<div class="card p-3 bg-white">
										<div class="fw-semibold mb-2 text-success">
											<i class="bi bi-check2-circle me-2"></i>Approve Payment Amount
										</div>
										<form th:action="@{'/medical/approve/' + ${c.id}}" method="post" class="row g-2">
											<div class="col-md-6">
												<input type="number" name="approvedAmount" step="0.01" class="form-control form-control-sm" placeholder="Approved Amount" required>
											</div>
											<div class="col-md-6">
												<input type="text" name="remarks" class="form-control form-control-sm" placeholder="Medical Remarks" required>
											</div>
											<div class="col-12">
												<button class="btn btn-success btn-sm fw-semibold w-100" type="submit">Approve</button>
											</div>
										</form>
									</div>

									<div class="card p-3 bg-white">
										<div class="fw-semibold mb-2 text-danger">
											<i class="bi bi-x-circle me-2"></i>Reject Claim
										</div>
										<form th:action="@{'/medical/reject/' + ${c.id}}" method="post" class="row g-2">
											<div class="col-12">
												<input type="text" name="remarks" class="form-control form-control-sm" placeholder="Rejection Reason" required>
											</div>
											<div class="col-12">
												<button class="btn btn-danger btn-sm fw-semibold w-100" type="submit">Reject</button>
											</div>
										</form>
									</div>

									<form th:action="@{'/medical/send-back/' + ${c.id}}" method="post">
										<button type="submit" class="btn btn-outline-warning btn-sm fw-semibold w-100"
											onclick="return confirm('Send back to reception for recheck?')">
											Send Back to Reception
										</button>
									</form>
								</div>
							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(claims)}">
							<td colspan="6" class="text-center text-muted py-4">No claims found.</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
