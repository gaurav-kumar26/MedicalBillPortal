<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Employee Form</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background: #f4f6fb; }
		.card-soft { border: 0; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
	</style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="d-flex">
	<div th:replace="fragments/sidebar :: sidebar"></div>

	<main class="flex-grow-1 p-4">
		<div class="container-fluid">
			<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
				<h2 class="fw-bold mb-0">Employee Management</h2>
				<a th:href="@{/employee/all}" class="btn btn-outline-secondary btn-sm fw-semibold">Back to List</a>
			</div>

			<div class="card card-soft p-4">
				<form th:action="@{/employee/save}" th:object="${employee}" method="post">
					<div class="row g-3">
						<div class="col-md-4">
							<label class="form-label fw-semibold">Employee Code</label>
							<input type="text" th:field="*{employeeCode}" class="form-control" required>
						</div>
						<div class="col-md-8">
							<label class="form-label fw-semibold">Full Name</label>
							<input type="text" th:field="*{name}" class="form-control" required>
						</div>

						<div class="col-md-6">
							<label class="form-label fw-semibold">Date of Birth</label>
							<input type="date" th:field="*{dob}" class="form-control">
						</div>
						<div class="col-md-6">
							<label class="form-label fw-semibold">Yearly Limit</label>
							<input type="number" step="0.01" th:field="*{yearlyLimit}" class="form-control">
						</div>

						<div class="col-md-6">
							<label class="form-label fw-semibold">Department</label>
							<input type="text" th:field="*{department}" class="form-control">
						</div>
						<div class="col-md-6">
							<label class="form-label fw-semibold">Designation</label>
							<input type="text" th:field="*{designation}" class="form-control">
						</div>

						<div class="col-md-6">
							<label class="form-label fw-semibold">Bank Account</label>
							<input type="text" th:field="*{bankAccount}" class="form-control">
						</div>
						<div class="col-md-6">
							<label class="form-label fw-semibold">IFSC Code</label>
							<input type="text" th:field="*{ifscCode}" class="form-control">
						</div>
					</div>

					<div class="d-flex flex-wrap gap-2 mt-4">
						<button type="submit" class="btn btn-primary fw-semibold">
							<i class="bi bi-save2 me-2"></i>Save Employee
						</button>
						<a th:href="@{/employee/all}" class="btn btn-outline-secondary fw-semibold">
							Cancel
						</a>
					</div>
				</form>
			</div>
		</div>
	</main>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
